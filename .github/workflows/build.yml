name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore SoundBoard.sln

      - name: Build Release
        run: msbuild SoundBoard.sln /p:Configuration=Release /m /verbosity:minimal

      - name: Upload SoundBoard.exe
        uses: actions/upload-artifact@v4
        with:
          name: SoundBoard
          path: SoundBoard/bin/Release/SoundBoard.exe
          if-no-files-found: error
