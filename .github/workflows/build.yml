name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore SoundBoard.sln

      - name: Build Release
        run: msbuild SoundBoard.sln /p:Configuration=Release /m /verbosity:minimal

      # vstest.console rather than `dotnet test`: the solution contains a legacy (non-SDK) WPF project that the dotnet CLI cannot build.
      # setup-msbuild only puts MSBuild on PATH, so locate vstest.console via vswhere (preinstalled on the runner image).
      - name: Run tests
        shell: pwsh
        run: |
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) { throw 'vstest.console.exe not found' }
          & $vstest SoundBoard.Tests\bin\Release\SoundBoard.Tests.dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload SoundBoard.exe
        uses: actions/upload-artifact@v4
        with:
          name: SoundBoard
          path: SoundBoard/bin/Release/SoundBoard.exe
          if-no-files-found: error
