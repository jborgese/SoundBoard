name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: >
        Describe the situation you run into, not only the feature you have in mind — there is often a
        simpler way to get to the same place.
      placeholder: "I run a stream with 60+ clips and scrolling through four pages to find one is slow."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like SoundBoard to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including anything you tried in SoundBoard today that almost works.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on a pull request for this
